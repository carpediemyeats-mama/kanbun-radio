<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漢文タイムトラベル！</title><style>body{background:#152235;color:#fff;font-family:system-ui;padding:24px;max-width:650px;margin:auto;line-height:1.8}h1{color:#f1c780}section{background:#273b53;border-radius:20px;padding:20px}audio{width:100%}button{padding:10px;margin:5px;background:#f1c780;border:0;border-radius:8px}</style><h1>漢文タイムトラベル！</h1><p>第1回・最強の矛と最強の盾！</p><section><p id="status">音声を確認しています…</p><audio controls preload="metadata" src="./episode.mp3"></audio></section><h2>チャプター</h2><div id="chapters"></div><p>VOICEVOX: No.7 / 青山龍星。中国史漫画とのつながりを楽しもう。</p><script>const a=document.querySelector('audio'),s=document.querySelector('#status');a.addEventListener('loadedmetadata',()=>s.textContent=a.duration>90?'再生できます':'音声を確認できません');a.addEventListener('error',()=>s.textContent='音声はまだ公開されていません');fetch('./episode.json').then(r=>r.json()).then(d=>d.chapters.forEach(c=>{let b=document.createElement('button');b.textContent=c.title;b.onclick=()=>{a.currentTime=c.start_seconds;a.play()};document.querySelector('#chapters').append(b)})).catch(()=>{});</script></html>
